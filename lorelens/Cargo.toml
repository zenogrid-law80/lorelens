[package]
name = "lorelens"
version = "0.1.0"
edition = "2024"
description = "A local-first Lore desktop client built with GPUI"
license = "MIT"

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.0"
gpui-component-assets = "=0.5.0"
serde_json = "1"
toml_edit = "0.22.27"
tempfile = "3"
unicode-segmentation = "1"
globset = "0.4"

[build-dependencies]
winresource = "0.1"

[profile.dev]
debug = 0
