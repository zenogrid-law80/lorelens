[package]
name = "lorelens"
version = "0.1.12"
edition = "2024"
description = "Lore desktop client built with GPUI"
license = "MIT"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.4" }
# macOS requires font-kit; without it GPUI uses a text system that renders no glyphs.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.4", features = ["font-kit"] }
gpui-component = "=0.6.1"
gpui-kit-assets = "=0.6.1"
serde_json = "1"
toml_edit = "0.25"
tempfile = "3"
unicode-segmentation = "1"
globset = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

[build-dependencies]
winresource = "0.1"
